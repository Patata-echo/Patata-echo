title: 简历
name: 赵娜
headline: AI系统测试工程师
bio: |
  大连理工大学城市学院 22届软件工程本科毕业。拥有3年跨国业务系统自动化测试与架构搭建经验，负责过覆盖41个国家的复杂电商系统质量保障。具备从0到1独立搭建测试体系的能力，在长链路系统的高并发调度、异常容错、资源复用及多语言国际化(i18n)场景下拥有丰富的实战经验。深度拥抱AI技术，对RAG、MCP、Agent工具调用、LangGraph状态机编排有深入认知，并在实际工作中成功落地了基于大模型(LLM)的测试报告智能归因系统。正致力于向AI Agent系统测试/应用开发工程师转型，期望将扎实的工程化稳定性经验与AI架构相结合。

